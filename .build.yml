image: ubuntu/jammy
packages:
  - build-essential
  - cmake
  - ninja-build
  - python3
  - python3-pip
  - pkg-config
  - libgtk-3-dev
  - libwebkit2gtk-4.0-dev
  - libssl-dev
  - curl
  - zip
  - git
  - ca-certificates
sources:
  - https://git.sr.ht/~itsams_wav/jrnl
tasks:
  - build-linux: |
      cd "$HOME/jrnl"
      python3 -m pip install --user --quiet conan
      export PATH="$HOME/.local/bin:$PATH"
      export CONAN_HOME="$HOME/.conan2"
      conan profile detect --force
      conan export recipes/webview --version 0.12.0
      conan install . --output-folder=build --build=missing -s build_type=Release
      cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
      cmake --build build --target jrnl --parallel
      zip jrnl-linux.zip build/jrnl
  - build-pwa: |
      cd "$HOME/jrnl"
      mkdir -p public/icons
      cp src/frontend.html public/index.html
      cp pwa/manifest.json public/manifest.json
      cp pwa/sw.js public/sw.js
      cp pwa/icons/icon.svg public/icons/icon.svg
      tar -czf jrnl-pwa.tar.gz public
artifacts:
  - jrnl/jrnl-linux.zip
  - jrnl/jrnl-pwa.tar.gz
