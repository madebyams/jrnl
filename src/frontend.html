<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA — ignored when loaded via set_html() in the desktop app -->
  <meta name="theme-color" content="#D9C6AF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="jrnl.">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon.svg">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100dvh; /* dvh shrinks with the mobile keyboard; falls back to vh */
      width: 100%;
      background: #D9C6AF;
      color: #000000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #D9C6AF; }
    ::-webkit-scrollbar-thumb { background: #b8a38a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a08f76; }

    #app {
      height: 100dvh;
      /* Respect notch / home-indicator safe areas on iOS */
      padding: max(2rem, env(safe-area-inset-top))
               max(2rem, env(safe-area-inset-right))
               max(2rem, env(safe-area-inset-bottom))
               max(2rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    #content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 56rem;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: bold;
      color: #000000;
      letter-spacing: -0.05em;
    }

    #editor-box {
      flex: 1;
      min-height: 0;
      border: 1px solid #b8a38a;
      border-radius: 0.5rem;
      padding: 1rem;
      background: #ecdec9;
      display: flex;
      flex-direction: column;
    }

    textarea {
      flex: 1;
      min-height: 0;
      background: transparent;
      color: #000000;
      outline: none;
      resize: none;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      line-height: 1.5rem;
      border: none;
      overflow-y: auto;
      /* Remove tap highlight and 300 ms delay on mobile */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="content">
      <h1>jrnl.</h1>
      <div id="editor-box">
        <textarea id="editor" placeholder="Write your thoughts here..."></textarea>
      </div>
    </div>
  </div>
  <script>
    const editor = document.getElementById('editor');

    editor.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        e.stopPropagation();
        editor.select();
      }
    });

    editor.focus();

    // Register service worker for PWA offline support.
    // Silently no-ops when loaded via set_html() in the desktop app
    // (null origin — SW registration is rejected by the browser quietly).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
