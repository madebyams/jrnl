<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%; width: 100%;
      background: #D9C6AF;
      color: #000000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #D9C6AF; }
    ::-webkit-scrollbar-thumb { background: #b8a38a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a08f76; }

    #app {
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
    }

    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 56rem;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: bold;
      color: #000000;
      letter-spacing: -0.05em;
    }

    #editor-box {
      flex: 1;
      border: 1px solid #b8a38a;
      border-radius: 0.5rem;
      padding: 1rem;
      background: #ecdec9;
      display: flex;
      flex-direction: column;
    }

    textarea {
      flex: 1;
      background: transparent;
      color: #000000;
      outline: none;
      resize: none;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      line-height: 1.5rem;
      border: none;
      min-height: calc(100vh - 8rem);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="content">
      <h1>jrnl.</h1>
      <div id="editor-box">
        <textarea id="editor" placeholder="Write your thoughts here..."></textarea>
      </div>
    </div>
  </div>
  <script>
    const editor = document.getElementById('editor');
    editor.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
        e.stopPropagation();
        editor.select();
      }
    });
    editor.focus();
  </script>
</body>
</html>
