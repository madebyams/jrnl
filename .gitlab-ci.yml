########################################################################
# jrnl. — GitLab CI/CD
#
# Platform note
#   jrnl. uses WKWebView which is macOS-only. A macOS runner is required
#   to produce a .app bundle. Because only a Linux runner is available
#   here, CI does the next best thing:
#
#   • build:linux — Ubuntu 22.04 Docker container, WebKit2GTK
#
#   This validates that the code compiles on Linux.
#   The release stage publishes the Linux binary on a vX.Y.Z tag push.
#
#   macOS .app builds must be done locally (see README — "Building").
#
# Runner tags
#   amd64 — Linux shell/Docker runner
########################################################################

default:
  tags:
    - amd64

stages:
  - build
  - release
  - deploy

variables:
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

# ── Linux build ────────────────────────────────────────────────────────
build:linux:
  stage: build
  image: ubuntu:22.04
  cache:
    key: "conan-linux-$CI_COMMIT_REF_SLUG"
    paths:
      - .conan2/
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential cmake ninja-build python3 python3-pip pkg-config
        libgtk-3-dev libwebkit2gtk-4.0-dev
        curl zip git ca-certificates
    - pip3 install --quiet conan
    - conan profile detect --force
  script:
    # Export the local webview recipe, then pre-generate the Conan toolchain
    # so CMake does not need a two-pass configure.
    - conan export recipes/webview --version 0.12.0
    - conan install . --output-folder=build --build=missing -s build_type=Release
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
    - cmake --build build --target jrnl --parallel
  artifacts:
    name: "jrnl-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/jrnl
    expire_in: 1 week

# ── GitLab Pages — PWA (main branch only) ─────────────────────────────
# Publishes the frontend as a Progressive Web App via GitLab Pages.
# Enable Pages for this project in GitLab → Settings → Pages.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public/icons
    - cp src/frontend.html public/index.html
    - cp pwa/manifest.json public/manifest.json
    - cp pwa/sw.js        public/sw.js
    - cp pwa/icons/icon.svg public/icons/icon.svg
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ── Release (tag pushes only) ──────────────────────────────────────────
release:
  stage: release
  image: ubuntu:22.04
  needs:
    - job: build:linux
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl zip
  script:
    - zip "jrnl-${CI_COMMIT_TAG}-linux.zip" build/jrnl

    # Upload Linux binary
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "jrnl-${CI_COMMIT_TAG}-linux.zip" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jrnl/${CI_COMMIT_TAG}/jrnl-${CI_COMMIT_TAG}-linux.zip"

    # Create GitLab Release with link to the Linux binary
    - |
      curl --fail --silent --show-error \
           --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"jrnl. ${CI_COMMIT_TAG}\",
             \"tag_name\": \"${CI_COMMIT_TAG}\",
             \"description\": \"## jrnl. ${CI_COMMIT_TAG}\n\nPre-built binary for Linux is attached below.\n\n**macOS** — build locally, see [README](README.md).\",
             \"assets\": {
               \"links\": [
                 {
                   \"name\": \"jrnl-${CI_COMMIT_TAG}-linux.zip\",
                   \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jrnl/${CI_COMMIT_TAG}/jrnl-${CI_COMMIT_TAG}-linux.zip\"
                 }
               ]
             }
           }" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  artifacts:
    name: "jrnl-${CI_COMMIT_TAG}-release"
    paths:
      - "jrnl-${CI_COMMIT_TAG}-linux.zip"
    expire_in: never
