########################################################################
# jrnl. — GitLab CI/CD
#
# Platform note
#   jrnl. uses WKWebView which is macOS-only. A macOS runner is required
#   to produce a .app bundle. Because only Linux/Windows runners are
#   available here, CI does the next best thing:
#
#   • build:linux  — compiles a Linux binary inside a Docker container.
#                    Catches C++ and HTML-embed errors on every push.
#   • release      — on a vX.Y.Z tag: publishes the Linux binary as a
#                    GitLab Release artifact.
#
#   macOS .app builds must be done locally (see README — "Building").
#   The resulting jrnl.app can be uploaded manually to the release page.
########################################################################

default:
  tags:
    - amd64

stages:
  - build
  - release

variables:
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

# ── Build (Linux, every push) ──────────────────────────────────────────
build:linux:
  stage: build
  image: ubuntu:22.04
  cache:
    key: "conan-linux-$CI_COMMIT_REF_SLUG"
    paths:
      - .conan2/
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential cmake ninja-build python3 python3-pip pkg-config
        libgtk-3-dev libwebkit2gtk-4.0-dev
        curl zip git ca-certificates
    - pip3 install --quiet conan
    - conan profile detect --force
  script:
    # CMakeLists.txt runs `conan install` itself and then FATAL_ERRORs on
    # the first pass (by design) so the generated toolchain can be included
    # on the second pass.
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja || true
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
    - cmake --build build --target jrnl --parallel
  artifacts:
    name: "jrnl-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/jrnl
    expire_in: 1 week

# ── Release (Linux binary, tag pushes only) ────────────────────────────
release:
  stage: release
  image: ubuntu:22.04
  needs: [build:linux]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl zip
  script:
    # Package the Linux binary
    - zip "jrnl-${CI_COMMIT_TAG}-linux.zip" build/jrnl

    # Upload to GitLab Package Registry (generic packages)
    - |
      curl --fail --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "jrnl-${CI_COMMIT_TAG}-linux.zip" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jrnl/${CI_COMMIT_TAG}/jrnl-${CI_COMMIT_TAG}-linux.zip"

    # Create the GitLab Release entry
    - |
      curl --fail --silent --show-error \
           --request POST \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --header "Content-Type: application/json" \
           --data "{
             \"name\": \"jrnl. ${CI_COMMIT_TAG}\",
             \"tag_name\": \"${CI_COMMIT_TAG}\",
             \"description\": \"## jrnl. ${CI_COMMIT_TAG}\n\n**Linux binary** is attached below.\n\n**macOS** — build locally and refer to the [README](README.md):\n\`\`\`\ncmake -B cmake-build-release -DCMAKE_BUILD_TYPE=Release\ncmake -B cmake-build-release -DCMAKE_BUILD_TYPE=Release\ncmake --build cmake-build-release --target jrnl\n\`\`\`\",
             \"assets\": {
               \"links\": [{
                 \"name\": \"jrnl-${CI_COMMIT_TAG}-linux.zip\",
                 \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jrnl/${CI_COMMIT_TAG}/jrnl-${CI_COMMIT_TAG}-linux.zip\"
               }]
             }
           }" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  artifacts:
    name: "jrnl-${CI_COMMIT_TAG}-release"
    paths:
      - "jrnl-${CI_COMMIT_TAG}-linux.zip"
    expire_in: never
